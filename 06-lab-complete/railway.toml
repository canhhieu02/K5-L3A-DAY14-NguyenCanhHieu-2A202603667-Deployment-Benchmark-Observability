# ============================================================
# Cấu hình deploy Railway (tiêu chí 12)
#   - Build bằng chính Dockerfile → môi trường cloud giống hệt môi trường đã test
#   - Railway chỉ chuyển traffic sang bản mới khi /health trả 200
#   - PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT}
#   - Secret (AGENT_API_KEY, REDIS_URL) đặt ở tab Variables, KHÔNG ghi ở đây
# ============================================================
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
