# ============================================================
# Agent + Redis bằng một lệnh: docker compose up --build   (tiêu chí 2)
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false        # không có .env (vd máy chấm) vẫn chạy được
    environment:
      # Gọi Redis bằng TÊN SERVICE (DNS nội bộ của Compose), không dùng localhost
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
